{% load static %}

<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>WORKPULSE - Employee Login</title>

    <link
        rel="stylesheet"
        href="{% static 'core/css/style.css' %}"
    >

    <style>

        /* =========================================
           EMPLOYEE LOGIN - PURPLE FADE THEME
           ========================================= */

        .employee-login-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(124, 92, 246, 0.14),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(99, 102, 241, 0.13),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #f8f7ff 0%,
                    #faf9ff 45%,
                    #f0fdfa 100%
                );
        }


        /* =========================================
           DECORATIVE FADED CIRCLES
           ========================================= */

        .employee-login-page::before {
            content: "";

            position: fixed;

            width: 430px;
            height: 430px;

            border-radius: 50%;

            background:
                rgba(124, 92, 246, 0.055);

            top: -175px;
            right: -125px;

            pointer-events: none;
        }


        .employee-login-page::after {
            content: "";

            position: fixed;

            width: 370px;
            height: 370px;

            border-radius: 50%;

            background:
                rgba(99, 102, 241, 0.055);

            bottom: -155px;
            left: -125px;

            pointer-events: none;
        }


        .employee-login-page .form-wrapper {
            width: 100%;

            position: relative;

            z-index: 2;
        }


        /* =========================================
           LOGIN CARD
           ========================================= */

        .employee-login-card {
            width: min(440px, calc(100% - 32px));

            margin: 0 auto;

            padding: 38px 40px 32px;

            box-sizing: border-box;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.92);

            border:
                1px solid rgba(124, 92, 246, 0.08);

            box-shadow:
                0 25px 60px
                rgba(76, 58, 150, 0.10);
        }


        /* =========================================
           LOGO
           ========================================= */

        .employee-login-logo {
            width: 66px;
            height: 66px;

            margin: 0 auto 18px;

            border-radius: 19px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #7c5cf6,
                    #6941e8
                );

            color: #ffffff;

            font-size: 29px;

            font-weight: 800;

            box-shadow:
                0 12px 28px
                rgba(105, 65, 232, 0.24);
        }


        /* =========================================
           LABEL
           ========================================= */

        .employee-login-label {
            display: block;

            margin-bottom: 8px;

            color: #6d4de8;

            font-size: 9px;

            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;
        }


        /* =========================================
           HEADING
           ========================================= */

        .employee-login-card h1 {
            margin: 0 0 8px;

            color: #20263a;

            font-size: 30px;

            line-height: 1.15;

            font-weight: 800;
        }


        .employee-login-subtitle {
            margin: 0 0 28px;

            color: #8a93a8;

            font-size: 11px;

            line-height: 1.6;
        }


        /* =========================================
           ERROR
           ========================================= */

        .employee-login-error {
            margin-bottom: 20px;

            padding: 12px 14px;

            border-radius: 11px;

            text-align: left;

            background:
                rgba(239, 68, 68, 0.07);

            border:
                1px solid rgba(239, 68, 68, 0.15);

            color: #c62828;

            font-size: 10px;

            line-height: 1.5;
        }


        /* =========================================
           FORM
           ========================================= */

        .employee-login-form {
            text-align: left;
        }


        .employee-login-form .input-group {
            margin-bottom: 17px;
        }


        .employee-login-form label {
            display: block;

            margin-bottom: 7px;

            color: #596278;

            font-size: 10px;

            font-weight: 700;
        }


        /* =========================================
           INPUTS
           ========================================= */

        .employee-login-input {
            width: 100%;

            box-sizing: border-box;

            padding: 13px 14px;

            border-radius: 11px;

            border:
                1px solid rgba(100, 90, 130, 0.15);

            background:
                rgba(250, 249, 255, 0.90);

            color: #252c40;

            font-size: 11px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        .employee-login-input::placeholder {
            color: #a4abbb;
        }


        .employee-login-input:focus {
            background: #ffffff;

            border-color:
                rgba(124, 92, 246, 0.45);

            box-shadow:
                0 0 0 3px
                rgba(124, 92, 246, 0.09);
        }


        /* =========================================
           SIGN IN BUTTON
           ========================================= */

        .employee-login-submit {
            width: 100%;

            margin-top: 7px;

            padding: 13px 18px;

            border: 0;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #7c5cf6,
                    #6941e8
                );

            color: #ffffff;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 9px 20px
                rgba(105, 65, 232, 0.20);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .employee-login-submit:hover {
            transform: translateY(-1px);

            box-shadow:
                0 12px 25px
                rgba(105, 65, 232, 0.28);
        }


        .employee-login-submit:active {
            transform: translateY(0);
        }


        /* =========================================
           DIVIDER
           ========================================= */

        .employee-login-divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 25px 0 18px;

            color: #a2a9b9;

            font-size: 9px;
        }


        .employee-login-divider::before,
        .employee-login-divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(100, 90, 130, 0.10);
        }


        /* =========================================
           ADMIN LOGIN LINK
           ========================================= */

        .admin-login-link {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            box-sizing: border-box;

            padding: 11px 15px;

            border-radius: 10px;

            border:
                1px solid rgba(124, 92, 246, 0.12);

            background:
                rgba(248, 247, 255, 0.75);

            color: #596278;

            text-decoration: none;

            font-size: 10px;

            font-weight: 700;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }


        .admin-login-link:hover {
            background:
                rgba(124, 92, 246, 0.06);

            border-color:
                rgba(124, 92, 246, 0.20);

            color: #6941e8;
        }


        .back-to-welcome-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 12px;
            color: #a0a7b7;
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s ease;
        }


        .back-to-welcome-link:hover {
            color: #6941e8;
        }


        /* =========================================
           FOOTER
           ========================================= */

        .employee-login-footer {
            margin-top: 24px;

            padding-top: 18px;

            border-top:
                1px solid rgba(100, 90, 130, 0.08);

            color: #a0a7b7;

            font-size: 9px;

            line-height: 1.5;
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 520px) {

            .employee-login-card {
                padding: 30px 22px 26px;
            }

            .employee-login-card h1 {
                font-size: 26px;
            }

            .employee-login-logo {
                width: 58px;
                height: 58px;

                font-size: 25px;
            }

        }

    </style>

</head>


<body class="form-page employee-login-page">


<main class="form-wrapper">


    <!-- =========================================
         EMPLOYEE LOGIN CARD
         ========================================= -->

    <section class="form-card employee-login-card">


        <!-- LOGO -->

        <div class="employee-login-logo">
            W
        </div>


        <!-- LABEL -->

        <span class="employee-login-label">
            WORKPULSE EMPLOYEE PORTAL
        </span>


        <!-- HEADING -->

        <h1>
            Welcome back
        </h1>


        <p class="employee-login-subtitle">
            Sign in to view your workspace
        </p>


        <!-- ERROR -->

        {% if error %}

            <div class="employee-login-error">
                ⚠ {{ error }}
            </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form
            method="post"
            class="employee-login-form"
        >

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    class="employee-login-input"
                    id="username"
                    name="username"
                    type="text"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    class="employee-login-input"
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- SIGN IN -->

            <button
                class="employee-login-submit"
                type="submit"
            >
                🔐 Sign in
            </button>

        </form>


        <!-- DIVIDER -->

        <div class="employee-login-divider">

            <span>
                or
            </span>

        </div>


        <!-- ADMIN LOGIN -->

        <a
            class="admin-login-link"
            href="{% url 'admin_login' %}"
        >
            🛡️ Administrator login
        </a>


        <a
            class="back-to-welcome-link"
            href="{% url 'welcome' %}"
        >
            ← Back to Welcome
        </a>


        <!-- FOOTER -->

        <div class="employee-login-footer">

            WORKPULSE • Employee Management System

        </div>


    </section>


</main>


<script src="{% static 'core/js/app.js' %}"></script>

</body>

</html>
